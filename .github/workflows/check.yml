on: { pull_request: {}, push: { branches: [main] } }
permissions: { contents: read }
env:
  REQUIRE_CHROME: "1"
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with: { fetch-depth: 0 }
      - run: scripts/check.py index.html
      - if: github.event_name == 'pull_request'
        env: { BASE: "${{ github.base_ref }}", HEAD: "${{ github.head_ref }}" }
        run: scripts/check.py --diff "origin/$BASE" --branch "$HEAD"
      - run: scripts/test.py
  scope:
    # Fill-batch PRs may only touch index.html.
    if: github.event_name == 'pull_request' && startsWith(github.head_ref, 'feat/fill-batch-')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with: { fetch-depth: 0 }
      - env: { BASE: "${{ github.base_ref }}" }
        run: |
          extra=$(git diff --name-only "origin/$BASE...HEAD" | grep -vx 'index.html' || true)
          if [ -n "$extra" ]; then echo "fill-batch PR changes files besides index.html:"; echo "$extra"; exit 1; fi
  merge:
    # Fill-batch PRs only: merge once `check` and `scope` have passed. The agent never merges.
    needs: [check, scope]
    if: >
      github.event_name == 'pull_request' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      startsWith(github.head_ref, 'feat/fill-batch-') &&
      github.event.pull_request.user.login == github.repository_owner
    runs-on: ubuntu-latest
    permissions: { contents: write, pull-requests: write }
    steps:
      - run: gh pr merge --rebase "$PR_URL"
        env: { GH_TOKEN: "${{ github.token }}", PR_URL: "${{ github.event.pull_request.html_url }}" }
