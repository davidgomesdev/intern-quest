on: { pull_request: {}, push: { branches: [main] } }
permissions: { contents: read }
env:
  REQUIRE_CHROME: "1"
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with: { fetch-depth: 0 }
      - run: scripts/check.py index.html
      - if: github.event_name == 'pull_request'
        env: { BASE: "${{ github.base_ref }}", HEAD: "${{ github.head_ref }}" }
        run: scripts/check.py --diff "origin/$BASE" --branch "$HEAD"
      - run: scripts/test.py
  merge:
    # Fill-batch PRs only: merge once `check` has passed. The agent never merges.
    needs: check
    if: >
      github.event_name == 'pull_request' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      startsWith(github.head_ref, 'feat/fill-batch-') &&
      github.event.pull_request.user.login == github.repository_owner
    runs-on: ubuntu-latest
    permissions: { contents: write, pull-requests: write }
    steps:
      - run: gh pr merge --rebase "$PR_URL"
        env: { GH_TOKEN: "${{ github.token }}", PR_URL: "${{ github.event.pull_request.html_url }}" }
